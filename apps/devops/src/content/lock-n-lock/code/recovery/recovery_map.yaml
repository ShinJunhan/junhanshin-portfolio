# --------------------------------------------------
# Security Events
# --------------------------------------------------

# A spike in failed logins
# For an operator to look at
HighLoginFailureRate:
  description: "High login failure rate detected"

  category: security
  notify: true
  log: event.log

  mode: notify_only


# Rate limiting has kicked in
# For an operator to look at
RateLimitTriggered:
  description: "Rate limit triggered"

  category: security
  notify: true
  log: event.log

  mode: notify_only


