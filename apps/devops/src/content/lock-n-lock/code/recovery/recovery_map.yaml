# ==================================================
# Recovery Policy Configuration
# ==================================================
#
# mode
#
# auto_recovery
#   - The Recovery Controller performs the recovery automatically
#   - On a successful verify, a recovery-success entry is logged
#
# notify_only
#   - No automatic recovery is attempted
#   - Alerting and an Event History entry only
#
# category
#
# user_service
#   - A user-facing service failure
#   - Alert: yes / auto-recovery: yes / recovery.log
#
# maintenance
#   - An operational component failure
#   - Alert: no / auto-recovery: yes / maintenance.log
#
# security
#   - A security event
#   - Alert: yes / auto-recovery: no / event.log
#
# Notes
#   - The PostgresDown policy is still to be decided
#   - Notify-only vs. promoting the replica is under review
#   - RecoveryControllerDown cannot recover itself, so a separate protection
#     mechanism is under review
#
# ==================================================


# --------------------------------------------------
# User Service Recovery
# --------------------------------------------------

# App service failure
BankAppDown:
  description: "LockBank FastAPI container is down"
  category: user_service
  notify: true
  notify_success: true
  log: recovery.log
  mode: auto_recovery
  action: restart_remote_container
  target: aws-app
  command: "bash ./actions/aws_app_restart.sh"
  pre_verify:
    type: http
    url: "${APP_HEALTH_URL}"
    timeout: 5
  verify:
    type: http
    url: "${APP_HEALTH_URL}"
    timeout: 5
  retry: 3
  verify_delay: 20
  retry_interval: 15
  cooldown: 30


