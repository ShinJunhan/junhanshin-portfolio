# --------------------------------------------------
# Maintenance Recovery
# --------------------------------------------------

# Operational component
# Recovered automatically when Prometheus goes down
PrometheusDown:
  description: "Prometheus service is down"

  category: maintenance
  notify: false
  log: maintenance.log

  mode: auto_recovery

  action: restart_container

  target: lb-monitoring-prometheus

  command: "bash ./actions/docker_restart.sh lb-monitoring-prometheus"

  pre_verify:
    type: http
    url: "http://prometheus:9090/-/ready"
    timeout: 5

  verify:
    type: http
    url: "http://prometheus:9090/-/ready"
    timeout: 5

  retry: 3
  cooldown: 300


